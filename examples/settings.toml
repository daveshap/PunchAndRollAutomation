# Every setting punchroll uses, with its default. Copy, change what you need,
# and pass with --config settings.toml (or `config = ...` in a project file).

threads = 0            # speech recognition threads; 0 picks automatically
level_match = true     # match later recordings' speech level to the first file
comps = true           # splice an earlier take over a slip in the last one; false keeps the last take whole

[pauses]               # seconds; [min, max] keeps a natural pause in range, a third value is the rebuilt length
head = 1.5             # room tone before the first word (ACX: 1 to 5 s)
tail = 3.0             # room tone after the last word (ACX: 1 to 5 s)
sentence = [0.30, 1.10]
paragraph = [0.80, 1.70, 1.20]
after_title = [0.80, 1.50, 1.00]          # after "Chapter One." / "Part Two."
heading_to_body = [1.50, 2.50, 2.00]
heading_to_heading = [1.00, 2.00, 1.50]
before_heading = [1.80, 3.00, 2.20]
cut_sentence = [0.55, 0.90]               # rebuilt pause between sentences where a take was cut
cut_within = [0.12, 0.45]                 # rebuilt pause inside a sentence where a take was cut
adlib = 0.25                              # an unscripted word at a line's edge is kept if it runs on within this
tolerance_short = 0.08                    # leave a pause alone this close to the minimum
tolerance_long = 0.15                     # ... or this close to the maximum

[master]
rms_db = -20.0               # ACX: -23 to -18 dB RMS
limiter_ceiling_db = -3.5    # true-peak ceiling for the WAV and the MP3; ACX's limit is -3 dB, the rest is room for their meter
highpass_hz = 70.0
compressor_threshold_db = -26.0
compressor_ratio = 2.0
noise_reduction = "auto"     # "auto": only when the noise floor would end above denoise_above_db; "on": always; "off": never
noise_reduction_db = 12.0    # how far the room's noise is turned down (Audacity: "Noise reduction (dB)")
noise_sensitivity = 6.0      # how far over the noise a sound must rise to be left alone (Audacity: "Sensitivity")
noise_smoothing = 3          # bands on either side that share each band's gain (Audacity: "Frequency smoothing (bands)")
denoise_above_db = -62.0     # "auto" steps in when the floor would be above this
wav_bits = 0                # WAV master: 0 = the recording's own bit depth (16 at least, 24 at most), or 16, or 24
mp3_kbps = 192               # ACX: 192 kbps or more, constant bit rate
mp3_sample_rate = 44100      # ACX: 44.1 kHz

[align]                # costs in tenths; see docs/how-it-works.md before changing these
restart = 9
skip = 40
insert = 10
insert_filler = 4
insert_edge = 6
delete = 10
substitute = 11
near = 3
max_cells = 400000000
