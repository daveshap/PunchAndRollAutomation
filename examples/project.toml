# A set of recordings for `punchroll batch project.toml`. Paths are relative to this file.
#
# For each recording, batch writes markup/<name>.transcript.md if there is no mark-up yet, and cuts and
# masters it once markup/<name>.md is there. A finished recording is left alone until its recording,
# its mark-up, or the settings file changes.

out = "edited"              # where the finished files and reports go
# markup = "markup"         # where the transcripts and the marked-up copies live (default)
# config = "settings.toml"  # optional settings, see settings.toml
# mp3 = true                # also write the MP3 (default)

[[chapter]]
name = "piece 01"
audio = "piece 01 - *.wav"  # one recording; a wildcard is fine if it matches one file

[[chapter]]
name = "piece 02"
audio = "piece 02 - take 1.wav"
# markup = "elsewhere/piece 02.md"   # if the marked-up transcript is kept somewhere else
