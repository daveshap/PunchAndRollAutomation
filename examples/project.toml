# A set of recordings for `punchroll batch project.toml`. Paths are relative to this file.
#
# For each recording, batch writes markup/<name>.transcript.md if there is no mark-up yet, and cuts and
# masters it once Claude has saved markup/<name>.md. Complete audio and reports are reused until
# a source, mark-up, project, settings, manuscript or renderer changes.

out = "edited"              # where the finished files and reports go
# markup = "markup"         # where the transcripts and the marked-up copies live (default)
# config = "settings.toml"  # optional settings, see settings.toml
# mp3 = true                # also write the MP3 (default)

[[chapter]]
name = "piece 01"
audio = "piece 01 - *.wav"  # one recording; a wildcard is fine if it matches one file

[[chapter]]
name = "piece 02"
audio = "piece 02 - take 1.wav"
# markup = "elsewhere/piece 02.md"   # if the marked-up transcript is kept somewhere else
# config = "other-settings.toml"     # settings for this recording only, in place of the project's

# To compare the chosen reading with a manuscript, name its section. The report lists the differences;
# Claude decides how they relate to the intended delivery. `batch --report-only` writes a preview.
[[chapter]]
name = "ch01"
audio = "raw/ch01.wav"
script = "book.md"                  # or set `script` once at the top of the file
from = "Chapter 1"                  # text from the heading this recording starts at
to = "Chapter 2"                    # and from the heading the next one starts at
# lines = "301-604"                 # or pick the part by line numbers in a Markdown manuscript

# `punchroll batch project.toml --proof` proofs each named finished output. For externally mastered
# files, use a project whose audio entries point to those files.
